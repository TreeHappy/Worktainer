# workmux global configuration. Per-project overrides live in a .workmux.yaml at
# the repo root, which this dotfiles repo does not manage.
#
# The multiplexer is auto-detected: the tracked bashrc starts Zellij, so $ZELLIJ
# selects the Zellij backend. Set WORKMUX_BACKEND to force one.
# https://workmux.raine.dev/guide/configuration/
nerdfont: false

# The built-in dashboard schemes have no Catppuccin Frappé preset, so override
# the palette directly (colours from https://github.com/catppuccin/catppuccin).
# https://workmux.raine.dev/guide/configuration/#themes
theme:
  custom:
    current_row_bg: "#414559" # surface0
    highlight_row_bg: "#51576d" # surface1
    current_worktree_fg: "#a6d189" # green
    dimmed: "#737994" # overlay0
    text: "#c6d0f5"
    border: "#737994" # overlay0
    help_border: "#626880" # surface2
    help_muted: "#949cbb" # overlay2
    header: "#ca9ee6" # mauve
    keycap: "#8caaee" # blue
    info: "#81c8be" # teal
    success: "#a6d189" # green
    warning: "#e5c890" # yellow
    danger: "#e78284" # red
    accent: "#ca9ee6" # mauve
