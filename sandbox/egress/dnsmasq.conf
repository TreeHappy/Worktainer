# dnsmasq config for the egress controller.
#
# The devbox's /etc/resolv.conf points at this container (10.89.1.2), so every
# lookup the devbox makes crosses the egress boundary and can be shaped,
# counted and logged exactly like its other traffic.
#
# The upstream servers are supplied on the command line by entrypoint.sh
# (--server="$DNS_UPSTREAM"); everything here is the part that never changes.

# Do not read /etc/resolv.conf and do not answer from /etc/hosts: the only
# answers are the ones an upstream server gives.
no-resolv
no-hosts

# Keep a small cache; bounded so a long-lived container does not grow.
cache-size=1000

# Listen on the data interface only (passed as --interface by entrypoint.sh).
bind-interfaces
