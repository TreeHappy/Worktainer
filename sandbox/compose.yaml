# The sandbox: a devbox whose every packet in and out crosses a controller.
#
#   ingress   the only way in  — host ports are DNAT'd to the devbox and to
#                               the telemetry web UIs
#   egress    the only way out — the devbox's default gateway, masquerading
#                               to the WAN and answering its DNS
#   ctrl      control-plane network shared by the two controllers and the
#             telemetry backends (nobody else can reach it)
#   data      the devbox network; its default route points at the egress
#   wan       the egress's uplink to the host
#
# The three networks are created by bin/networks, not by compose: they need
# options (`no_default_route`, `--route`, `metric`) the compose file cannot
# express, and the data network's default route must exist before the devbox
# starts. Run `bin/sandbox up`, which creates them first, or `bin/networks up`.
#
# Topology, usage and caveats: README.md.
name: sandbox

networks:
  ctrl:
    external: true
    name: sandbox-ctrl
  data:
    external: true
    name: sandbox-data
  wan:
    external: true
    name: sandbox-wan

volumes:
  o11ylite-data:
  otel-desktop-viewer-data:
  otelop-data:

services:
  # ------------------------------------------------------------------------
  # Controllers
  # ------------------------------------------------------------------------
  ingress:
    build: ./ingress
    image: localhost/sandbox-ingress:latest
    container_name: sandbox-ingress
    hostname: ingress
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      net.ipv4.ip_forward: 1
    dns:
      - 9.9.9.9
    environment:
      CTRL_IP: 10.89.0.3
      DATA_IP: 10.89.1.3
      # host-port:target-ip:target-port. The host ports are published below;
      # each is DNAT'd here to the devbox or to a telemetry UI. The 2222 pair
      # forwards to the sshd the devbox image ships, which listens on 2222
      # inside the devbox (an unprivileged sshd cannot bind 22).
      FORWARDS: >-
        2222:10.89.1.10:2222
        8080:10.89.1.10:8080
        9419:10.89.0.20:80
        9420:10.89.0.21:8000
        9421:10.89.0.22:4319
      RATE: 100mbit
      DELAY: 0ms
      LOSS: 0%
      OTEL_SERVICE_NAME: sandbox-ingress
      OTEL_ENDPOINTS: >-
        http://10.89.0.20/v1/traces
        http://10.89.0.21:4318/v1/traces
        http://10.89.0.22:4318/v1/traces
    ports:
      - "2222:2222"
      - "8080:8080"
      - "9419:9419"
      - "9420:9420"
      - "9421:9421"
    networks:
      ctrl:
        ipv4_address: 10.89.0.3
      data:
        ipv4_address: 10.89.1.3
    depends_on:
      - telemetry-o11ylite
      - telemetry-otel-desktop-viewer
      - telemetry-otelop
    restart: unless-stopped

  egress:
    build: ./egress
    image: localhost/sandbox-egress:latest
    container_name: sandbox-egress
    hostname: egress
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      net.ipv4.ip_forward: 1
    dns:
      - 9.9.9.9
    environment:
      CTRL_IP: 10.89.0.2
      DATA_IP: 10.89.1.2
      WAN_IP: 10.89.2.2
      WAN_GW: 10.89.2.1
      UP_RATE: 100mbit
      DOWN_RATE: 100mbit
      DELAY: 0ms
      LOSS: 0%
      DNS_UPSTREAM: 9.9.9.9
      OTEL_SERVICE_NAME: sandbox-egress
      OTEL_ENDPOINTS: >-
        http://10.89.0.20/v1/traces
        http://10.89.0.21:4318/v1/traces
        http://10.89.0.22:4318/v1/traces
    networks:
      ctrl:
        ipv4_address: 10.89.0.2
      data:
        ipv4_address: 10.89.1.2
      wan:
        ipv4_address: 10.89.2.2
    restart: unless-stopped

  # ------------------------------------------------------------------------
  # The sandbox itself. Built from sandbox/dev/Dockerfile against the repo
  # root, whose dotfiles/ folder holds every config source and whose
  # sandbox/dev/mise.toml is the container config — the image copies both
  # directly, so there is no synced copy of the sources to lag behind.
  # ------------------------------------------------------------------------
  devbox:
    build:
      context: ..
      dockerfile: sandbox/dev/Dockerfile
    image: localhost/sandbox-devbox:latest
    container_name: sandbox-devbox
    hostname: devbox
    # The image's CMD is an interactive bash. Here the devbox boots for real:
    # sshd-init loads ~/.ssh/authorized_keys from OpenBao (see sandbox/dev/
    # README.md), then the image's baked sshd takes over as the container
    # process — in the foreground (-D) with stderr logging (-e), so auth
    # attempts land in `bin/sandbox logs devbox`. Listening on 2222: the
    # unprivileged sshd cannot bind 22, and the ingress DNATs the host's 2222
    # to this port. The container lives only while sshd lives; a failure is
    # visible as a restart, not a silently dead sshd.
    command:
      - /bin/bash
      - -c
      - |
        set -e
        sshd-init
        exec /usr/sbin/sshd -D -e -f ~/.ssh/sshd/sshd_config
    # Where the devbox's secrets live: OpenBao (see sandbox/openbao/). The
    # bao CLI and sshd-init read BAO_ADDR/BAO_TOKEN from here; BAO_TOKEN is
    # that server's dev-mode root token — this is a devbox, not a production
    # vault.
    environment:
      BAO_ADDR: http://10.89.1.20:8200
      BAO_TOKEN: sandbox-root-token
    # DNS is served by the egress container, so lookups cross the boundary.
    dns:
      - 10.89.1.2
    networks:
      data:
        ipv4_address: 10.89.1.10
    depends_on:
      - egress
      - ingress
    restart: unless-stopped

  # ------------------------------------------------------------------------
  # Telemetry backends. One container each, so the same spans can be compared
  # across three different stores/UI. They live only on the control network;
  # their web UIs are reachable through the ingress (ports 9419-9421).
  # ------------------------------------------------------------------------
  telemetry-o11ylite:
    build: ./telemetry-o11ylite
    image: localhost/sandbox-telemetry-o11ylite:latest
    container_name: sandbox-telemetry-o11ylite
    hostname: telemetry-o11ylite
    networks:
      ctrl:
        ipv4_address: 10.89.0.20
    volumes:
      - o11ylite-data:/data
    restart: unless-stopped

  telemetry-otel-desktop-viewer:
    build: ./telemetry-otel-desktop-viewer
    image: localhost/sandbox-telemetry-otel-desktop-viewer:latest
    container_name: sandbox-telemetry-otel-desktop-viewer
    hostname: telemetry-otel-desktop-viewer
    # Keep the DuckDB file on the volume instead of the default in-memory
    # store, and do not try to launch a browser.
    command:
      - --host
      - 0.0.0.0
      - --grpc
      - "4317"
      - --http
      - "4318"
      - --browser-port
      - "8000"
      - --open-browser=false
      - --db
      - /data/otel-desktop-viewer.duckdb
    networks:
      ctrl:
        ipv4_address: 10.89.0.21
    volumes:
      - otel-desktop-viewer-data:/data
    restart: unless-stopped

  telemetry-otelop:
    build: ./telemetry-otelop
    image: localhost/sandbox-telemetry-otelop:latest
    container_name: sandbox-telemetry-otelop
    hostname: telemetry-otelop
    networks:
      ctrl:
        ipv4_address: 10.89.0.22
    volumes:
      - otelop-data:/data
    restart: unless-stopped
