# Configuration for the devbox image (sandbox/dev/Dockerfile).
#
# The Dockerfile builds from the repo root and copies this file plus the repo's
# `dotfiles/` folder into the image checkout, so the checkout mirrors the repo:
# `mise.toml` at the root and the sources under `dotfiles/`. Run mise from the
# checkout root.
#
# It is deliberately container-specific: `[bootstrap.packages]` (podman and the
# rootless helpers) is host-only and lives in the repo-root mise.toml; the image
# never runs `mise bootstrap`.

[tools]
atuin = "latest"
bat = "latest"
carapace = "latest"
duf = "latest"
dust = "latest"
eza = "latest"
fd = "latest"
fzf = "latest"
gh = "latest"
"github:RivoLink/leaf" = "latest"
hunk = "latest"
jj = "latest"
jjui = "latest"
jq = "latest"
lazygit = "latest"
neovim = "latest"
node = "latest"
opencode = { version = "latest", allow_builds = ["@opencode/cli"] }
pi = "latest"
"aqua:dalance/procs" = "latest"
ripgrep = "latest"
starship = "latest"
workmux = "latest"
yazi = "latest"
yq = "latest"
zellij = "latest"
zoxide = "latest"

[dotfiles]
"~/.bashrc" = { source = "dotfiles/bashrc" }
"~/.config/atuin/config.toml" = { source = "dotfiles/atuin/config.toml" }
"~/.config/bat" = { source = "dotfiles/bat", mode = "symlink-each" }
"~/.config/eza/theme.yml" = { source = "dotfiles/eza/theme.yml" }
"~/.config/hunk/config.toml" = { source = "dotfiles/hunk/config.toml" }
"~/.config/jjui" = { source = "dotfiles/jjui", mode = "symlink-each" }
"~/.config/lazygit/config.yml" = { source = "dotfiles/lazygit/config.yml" }
"~/.config/leaf" = { source = "dotfiles/leaf", mode = "symlink-each" }
"~/.config/opencode/cli.json" = { source = "dotfiles/opencode/cli.json" }
"~/.config/opencode/opencode.json" = { source = "dotfiles/opencode/opencode.json" }
"~/.config/procs/config.toml" = { source = "dotfiles/procs/config.toml" }
"~/.config/starship.toml" = { source = "dotfiles/starship.toml" }
"~/.config/workmux/config.yaml" = { source = "dotfiles/workmux/config.yaml" }
"~/.config/yazi" = { source = "dotfiles/yazi", mode = "symlink-each" }
"~/.config/zellij/config.kdl" = { source = "dotfiles/zellij/config.kdl" }
"~/.pi/agent" = { source = "dotfiles/pi", mode = "symlink-each" }
