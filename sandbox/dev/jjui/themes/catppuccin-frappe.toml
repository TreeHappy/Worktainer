# Catppuccin Frappé theme for jjui.
#
# Hand-written from the official Catppuccin Frappé palette, following the
# Catppuccin style guide for colour roles:
#   https://github.com/catppuccin/catppuccin/blob/main/docs/style-guide.md
#
# Frappé palette
#   base #303446   mantle #292c3c   crust #232634
#   surface0 #414559   surface1 #51576d   surface2 #626880
#   overlay0 #737994   overlay1 #838ba7   overlay2 #949cbb
#   text #c6d0f5   subtext1 #b5bfe2   subtext0 #a5adce
#   rosewater #f2d5cf   flamingo #eebebe   pink #f4b8e4   mauve #ca9ee6
#   red #e78284   maroon #ea999c   peach #ef9f76   yellow #e5c890
#   green #a6d189   teal #81c8be   sky #99d1db   sapphire #85c1dc
#   blue #8caaee   lavender #babbf1
#
# Role mapping (style guide -> jjui):
#   Background pane = base, secondary panes (status, menus, pop-ups) = mantle
#   Subtle text = overlay1, borders = overlay0
#   Body copy = text, sub-headlines = subtext0/1
#   Links/titles = blue, tags = blue, success = green, warnings = yellow,
#   errors = red, cursor = rosewater, selection = overlay2 (blended)
#
# A custom theme is self-contained, so every selector jjui asks for is set
# explicitly. Selected rows use surface1, then [dark] background_blend softens
# it toward the surrounding surface (loosely the guide's "overlay2 at 20-30%").

[colors]
# --- Global ---------------------------------------------------------------
text         = { fg = "#c6d0f5", bg = "#303446" }   # text on base
dimmed       = { fg = "#838ba7" }                   # overlay1 (subtle)
border       = { fg = "#737994" }                   # overlay0 (inactive border)
title        = { fg = "#8caaee", bold = true }      # blue
shortcut     = { fg = "#ca9ee6" }                   # mauve
matched      = { fg = "#e5c890", bold = true }      # yellow
":selected"  = { bg = "#51576d" }                   # surface1 (selection background)

success      = { fg = "#a6d189", bold = true }      # green
error        = { fg = "#e78284", bold = true }      # red

# Operation markers: text on a solid accent, so use base as the foreground.
source_marker = { fg = "#303446", bg = "#ef9f76", bold = true }  # base on peach
target_marker = { fg = "#303446", bg = "#a6d189", bold = true }  # base on green

# --- Diff / file status ---------------------------------------------------
# These also define the `added` / `deleted` / `modified` / `renamed` / `copied`
# aliases used by the details list.
"diff added"    = { fg = "#a6d189" }   # green
"diff removed"  = { fg = "#e78284" }   # red
"diff modified" = { fg = "#e5c890" }   # yellow
"diff renamed"  = { fg = "#85c1dc" }   # sapphire
"diff copied"   = { fg = "#81c8be" }   # teal

# --- Syntax highlighting (annotation view) --------------------------------
"syntax text"     = { fg = "#c6d0f5" }                # text
"syntax keyword"  = { fg = "#ca9ee6" }                # mauve
"syntax string"   = { fg = "#a6d189" }                # green
"syntax number"   = { fg = "#ef9f76" }                # peach
"syntax comment"  = { fg = "#949cbb", italic = true } # overlay2
"syntax function" = { fg = "#8caaee" }                # blue
"syntax type"     = { fg = "#e5c890" }                # yellow
"syntax class"    = { fg = "#e5c890" }                # yellow (same as type)

# --- Revset (top bar) -----------------------------------------------------
"revset title" = { fg = "#8caaee", bold = true }   # blue
"revset text"  = { fg = "#c6d0f5", bold = true }   # text

"revset completion"                  = { bg = "#292c3c" }              # mantle
"revset completion text"             = { fg = "#c6d0f5" }              # text
"revset completion matched"          = { fg = "#e5c890", bold = true } # yellow
"revset completion dimmed"           = { fg = "#838ba7" }              # overlay1
"revset completion:selected"         = { bg = "#51576d" }              # surface1
"revset completion text:selected"    = { fg = "#c6d0f5" }              # text
"revset completion matched:selected" = { fg = "#e5c890", bold = true } # yellow

# --- Revisions / Oplog / Evolog (main views) ------------------------------
revisions            = { bg = "#303446" }              # base
"revisions dimmed"   = { fg = "#838ba7" }              # overlay1
"revisions matched"  = { reverse = true }
"revisions details"  = { bg = "#303446" }              # base
"revisions details dimmed"          = { fg = "#838ba7" }              # overlay1
"revisions details dimmed:selected" = { fg = "#c6d0f5" }              # text

oplog           = { bg = "#303446" }   # base
"oplog matched" = { reverse = true }

evolog         = { bg = "#303446" }    # base
"evolog dimmed" = { fg = "#838ba7" }   # overlay1

# --- Status (bottom bar) --------------------------------------------------
status            = { bg = "#292c3c" }                                  # mantle
"status title"    = { fg = "#303446", bg = "#8caaee", bold = true }     # base on blue
"status dimmed"   = { fg = "#838ba7" }                                  # overlay1
"status shortcut" = { fg = "#ca9ee6" }                                  # mauve
"status input text" = { fg = "#c6d0f5" }                               # text

# --- Help -----------------------------------------------------------------
help            = { bg = "#292c3c" }                                  # mantle
"help title"    = { fg = "#8caaee", bold = true, underline = true }   # blue
"help border"   = { fg = "#737994" }                                  # overlay0
"help desc"     = { fg = "#c6d0f5" }                                  # text
"help dimmed"   = { fg = "#838ba7" }                                  # overlay1
"help shortcut" = { fg = "#ca9ee6" }                                  # mauve

# --- Preview / Diff / Annotation ------------------------------------------
preview          = { fg = "#c6d0f5", bg = "#303446" }   # text on base
"preview border" = { fg = "#737994" }                   # overlay0

diff = { bg = "#303446" }                               # base

annotation           = { fg = "#c6d0f5", bg = "#303446" }   # text on base
"annotation title"   = { fg = "#8caaee", bold = true }      # blue
"annotation dimmed"  = { fg = "#838ba7" }                   # overlay1
"annotation error"   = { fg = "#e78284" }                   # red

# --- Confirmation / Undo dialogs ------------------------------------------
confirmation            = { bg = "#292c3c" }                        # mantle
"confirmation text"     = { fg = "#c6d0f5" }                        # text
"confirmation dimmed"   = { fg = "#838ba7" }                        # overlay1
"confirmation border"   = { fg = "#e78284" }                        # red (destructive)
"confirmation:selected" = { fg = "#c6d0f5", bg = "#51576d", bold = true }

undo                           = { bg = "#292c3c" }                  # mantle
"undo confirmation dimmed"     = { fg = "#838ba7" }                  # overlay1
"undo confirmation:selected"   = { fg = "#c6d0f5", bg = "#51576d" }

# --- Git menu -------------------------------------------------------------
git             = { bg = "#292c3c" }                                 # mantle
"git text"      = { fg = "#c6d0f5" }                                 # text
"git title"     = { fg = "#8caaee", bg = "default", bold = true }    # blue
"git matched"   = { fg = "#e5c890", bold = true }                    # yellow
"git:selected"  = { fg = "#c6d0f5", bg = "#51576d", bold = true }
"git border"    = { fg = "#737994" }                                 # overlay0
"git remote title"   = { fg = "#ca9ee6", bg = "default", bold = true }  # mauve
"git remote text"    = { fg = "#b5bfe2" }                               # subtext1
"git remote dimmed"  = { fg = "#838ba7" }                               # overlay1
"git remote error"   = { fg = "#e78284" }                               # red
"git input text"     = { fg = "#c6d0f5" }                               # text
"git input matched"  = { fg = "#e5c890", bold = true }                  # yellow
"git menu text"      = { fg = "#c6d0f5" }                               # text

# --- Bookmarks menu -------------------------------------------------------
bookmarks              = { bg = "#292c3c" }                               # mantle
"bookmarks text"       = { fg = "#c6d0f5" }                               # text
"bookmarks title"      = { fg = "#8caaee", bg = "default", bold = true }  # blue
"bookmarks matched"    = { fg = "#e5c890", bold = true }                  # yellow
"bookmarks:selected"   = { fg = "#c6d0f5", bg = "#51576d", bold = true }
"bookmarks border"     = { fg = "#737994" }                               # overlay0
"bookmarks remote title"  = { fg = "#ca9ee6", bg = "default", bold = true }  # mauve
"bookmarks remote text"   = { fg = "#b5bfe2" }                               # subtext1
"bookmarks remote dimmed" = { fg = "#838ba7" }                               # overlay1
"bookmarks remote error"  = { fg = "#e78284" }                               # red
"bookmarks input text"    = { fg = "#c6d0f5" }                               # text
"bookmarks input matched" = { fg = "#e5c890", bold = true }                  # yellow
"bookmarks menu"          = { bg = "#292c3c" }                               # mantle
"bookmarks menu:selected" = { fg = "#c6d0f5", bg = "#51576d" }
"bookmarks menu text"     = { fg = "#c6d0f5" }                               # text
"bookmarks menu matched"  = { fg = "#e5c890", bold = true }                  # yellow

# --- Pickers / Choose / Input / Password ----------------------------------
picker            = { bg = "#292c3c" }                        # mantle
"picker text"     = { fg = "#c6d0f5" }                        # text
"picker dimmed"   = { fg = "#838ba7" }                        # overlay1
"picker matched"  = { fg = "#e5c890", bold = true }           # yellow
"picker bookmark" = { fg = "#8caaee" }                        # blue (tag/pill)
"picker badge"    = { fg = "#303446", bg = "#8caaee", bold = true }  # base on blue
"picker:selected" = { bg = "#51576d" }                        # surface1
"picker border"   = { fg = "#737994" }                        # overlay0

choose          = { bg = "#292c3c" }                     # mantle
"choose title"  = { fg = "#8caaee", bold = true }        # blue
"choose text"   = { fg = "#c6d0f5" }                     # text
"choose input"  = { fg = "#c6d0f5" }                     # text
"choose border" = { fg = "#737994" }                     # overlay0

input          = { bg = "#292c3c" }                      # mantle
"input title"  = { fg = "#8caaee", bold = true }         # blue
"input text"   = { fg = "#c6d0f5" }                      # text
"input border" = { fg = "#737994" }                      # overlay0

password          = { bg = "#292c3c" }                   # mantle
"password title"  = { fg = "#8caaee", bold = true }      # blue
"password border" = { fg = "#737994" }                   # overlay0

# --- Flash messages / command history -------------------------------------
"flash text"    = { fg = "#c6d0f5", bg = "#292c3c" }   # text on mantle
"flash success" = { fg = "#a6d189", bg = "#292c3c" }   # green on mantle
"flash error"   = { fg = "#e78284", bg = "#292c3c" }   # red on mantle
"flash matched" = { fg = "#e5c890", bold = true }      # yellow

[dark]
# Soften the surface1 selection background toward the surrounding surface so it
# reads like the style guide's "overlay2 at 20-30%" regardless of the pane.
background_blend = 0.4
