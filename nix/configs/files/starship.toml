"$schema" = 'https://starship.rs/config-schema.json'

# Catppuccin Frappé — palettes must be defined AFTER this line
palette = "catppuccin_frappe"

format = """
$directory\
${custom.jj}\
${custom.jj_status}\
$nodejs\
$rust\
$golang\
$python\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold lavender)"

[directory]
style = "bold lavender"
truncation_length = 3
truncate_to_repo = true

# ── jj (Jujutsu) — replaces the built-in git modules ────────────
# Starship has no native jj support, so these modules shell out to `jj`.
# `--ignore-working-copy` keeps the prompt fast and free of side effects; the
# working-copy state shown is therefore the last snapshot (any jj command
# refreshes it). https://github.com/jj-vcs/jj/wiki/Starship
[custom.jj]
description = "Current jj bookmark, or change id when there is none"
when = "jj --ignore-working-copy root"
symbol = "jj "
style = "bold mauve"
format = "[$symbol$output]($style) "
command = '''
jj log -r @ -n 1 --ignore-working-copy --no-graph -T '
  separate(" ",
    if(bookmarks,
      bookmarks.map(|b| b.name()).join(" "),
      change_id.shortest(8)
    ),
    if(conflict, "conflict"),
    if(divergent, "divergent"),
    if(immutable, "immutable")
  )
'
'''

[custom.jj_status]
description = "Working-copy change summary (files, insertions, deletions)"
when = "jj --ignore-working-copy root"
style = "bold peach"
format = "([$output]($style) )"
command = '''
jj log -r @ -n 1 --ignore-working-copy --no-graph -T '
  if(empty, "",
    separate(" ",
      diff.files().len() ++ "f",
      diff.stat().total_added() ++ "+",
      diff.stat().total_removed() ++ "-"
    )
  )
'
'''

# jj supersedes git at the prompt; keep the built-in git modules disabled.
[git_branch]
disabled = true

[git_status]
disabled = true

[nodejs]
style = "bold green"

[rust]
style = "bold peach"

[golang]
style = "bold teal"

[python]
style = "bold yellow"

[cmd_duration]
min_time = 500
style = "bold yellow"
format = "[$duration]($style)"

# ── Catppuccin Frappé palette (https://github.com/catppuccin/starship) ──
[palettes.catppuccin_frappe]
rosewater = "#f2d5cf"
flamingo = "#eebebe"
pink = "#f4b8e4"
mauve = "#ca9ee6"
red = "#e78284"
maroon = "#ea999c"
peach = "#ef9f76"
yellow = "#e5c890"
green = "#a6d189"
teal = "#81c8be"
sky = "#99d1db"
sapphire = "#85c1dc"
blue = "#8caaee"
lavender = "#babbf1"
text = "#c6d0f5"
subtext1 = "#b5bfe2"
subtext0 = "#a5adce"
