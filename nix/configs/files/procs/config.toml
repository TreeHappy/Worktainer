# procs — Catppuccin Frappé (256-colour approximation: procs has no hex support)
# Generated with `procs --gen-config`, then [style] remapped to the nearest
# Catppuccin Frappé palette entries (https://github.com/catppuccin/catppuccin).
[[columns]]
kind = "Pid"
style = "BrightYellow|Yellow"
numeric_search = true
nonnumeric_search = false
align = "Left"

[[columns]]
kind = "User"
style = "BrightGreen|Green"
numeric_search = false
nonnumeric_search = true
align = "Left"

[[columns]]
kind = "Separator"
style = "White|BrightBlack"
numeric_search = false
nonnumeric_search = false
align = "Left"

[[columns]]
kind = "Tty"
style = "BrightWhite|Black"
numeric_search = false
nonnumeric_search = false
align = "Left"

[[columns]]
kind = "UsageCpu"
style = "ByPercentage"
numeric_search = false
nonnumeric_search = false
align = "Right"

[[columns]]
kind = "UsageMem"
style = "ByPercentage"
numeric_search = false
nonnumeric_search = false
align = "Right"

[[columns]]
kind = "CpuTime"
style = "BrightCyan|Cyan"
numeric_search = false
nonnumeric_search = false
align = "Left"

[[columns]]
kind = "MultiSlot"
style = "ByUnit"
numeric_search = false
nonnumeric_search = false
align = "Right"

[[columns]]
kind = "Separator"
style = "White|BrightBlack"
numeric_search = false
nonnumeric_search = false
align = "Left"

[[columns]]
kind = "Command"
style = "BrightWhite|Black"
numeric_search = false
nonnumeric_search = true
align = "Left"

[style]
header = "147|147"     # lavender #babbf1
unit = "103|103"       # overlay1 #838ba7
tree = "103|103"       # overlay1 #838ba7

[style.by_percentage]
color_000 = "111|111"  # blue    #8caaee
color_025 = "115|115"  # teal    #81c8be
color_050 = "186|186"  # yellow  #e5c890
color_075 = "216|216"  # peach   #ef9f76
color_100 = "174|174"  # red     #e78284

[style.by_state]
color_d = "174|174"    # red     #e78284
color_r = "150|150"    # green   #a6d189
color_s = "111|111"    # blue    #8caaee
color_t = "115|115"    # teal    #81c8be
color_z = "182|182"    # mauve   #ca9ee6
color_x = "182|182"    # mauve   #ca9ee6
color_k = "186|186"    # yellow  #e5c890
color_w = "186|186"    # yellow  #e5c890
color_p = "186|186"    # yellow  #e5c890

[style.by_unit]
color_k = "111|111"    # blue    #8caaee
color_m = "150|150"    # green   #a6d189
color_g = "186|186"    # yellow  #e5c890
color_t = "174|174"    # red     #e78284
color_p = "174|174"    # red     #e78284
color_x = "111|111"    # blue    #8caaee
[search]
numeric_search = "Exact"
nonnumeric_search = "Partial"
logic = "And"
case = "Smart"

[display]
show_self = false
show_self_parents = false
show_thread = false
show_thread_in_tree = true
show_parent_in_tree = true
show_children_in_tree = true
show_header = true
show_footer = false
cut_to_terminal = true
cut_to_pager = false
cut_to_pipe = false
color_mode = "Auto"
separator = "│"
ascending = "▲"
descending = "▼"
tree_symbols = ["│", "─", "┬", "├", "└"]
abbr_sid = true
theme = "Dark"
show_kthreads = true

[sort]
column = 0
order = "Ascending"

[docker]
path = "unix:///var/run/docker.sock"

[pager]
mode = "Auto"
detect_width = false
use_builtin = false

