# Yazi configuration — https://yazi-rs.github.io/docs/configuration/yazi
#
# Theming lives in theme.toml (Catppuccin Frappé), which pulls in the vendored
# flavor under flavors/catppuccin-frappe.yazi/.
#
# Anything not listed here uses Yazi's shipped defaults.

[mgr]
# Give the preview pane more room than the default [1, 4, 3].
ratio = [1, 3, 4]

[preview]
# Wrap long lines in text previews.
wrap = "yes"
