# Catppuccin Frappé for lazygit — mauve accent.
# Adapted from https://github.com/catppuccin/lazygit (themes/frappe/mauve.yml);
# lazygit uses the terminal background, so there is no background colour here.
gui:
  theme:
    activeBorderColor:
      - "#ca9ee6"
      - bold
    inactiveBorderColor:
      - "#a5adce"
    searchingActiveBorderColor:
      - "#e5c890"
    optionsTextColor:
      - "#8caaee"
    selectedLineBgColor:
      - "#414559"
    inactiveViewSelectedLineBgColor:
      - "#737994"
    cherryPickedCommitFgColor:
      - "#ca9ee6"
    cherryPickedCommitBgColor:
      - "#51576d"
    markedBaseCommitFgColor:
      - "#8caaee"
    markedBaseCommitBgColor:
      - "#e5c890"
    unstagedChangesColor:
      - "#e78284"
    defaultFgColor:
      - "#c6d0f5"
    authorColors:
      "*": "#babbf1"
