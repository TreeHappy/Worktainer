"$schema" = 'https://starship.rs/config-schema.json'

# Catppuccin Frappé — palettes must be defined AFTER this line
palette = "catppuccin_frappe"

format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$rust\
$golang\
$python\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold lavender)"

[directory]
style = "bold lavender"
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = " "
style = "bold mauve"
format = "[$symbol$branch]($style)"

[git_status]
style = "bold peach"
format = "([$all_behind$ahead$deleted$modified$untracked]($style))"

[nodejs]
style = "bold green"

[rust]
style = "bold peach"

[golang]
style = "bold teal"

[python]
style = "bold yellow"

[cmd_duration]
min_time = 500
style = "bold yellow"
format = "[$duration]($style)"

# ── Catppuccin Frappé palette (https://github.com/catppuccin/starship) ──
[palettes.catppuccin_frappe]
rosewater = "#f2d5cf"
flamingo = "#eebebe"
pink = "#f4b8e4"
mauve = "#ca9ee6"
red = "#e78284"
maroon = "#ea999c"
peach = "#ef9f76"
yellow = "#e5c890"
green = "#a6d189"
teal = "#81c8be"
sky = "#99d1db"
sapphire = "#85c1dc"
blue = "#8caaee"
lavender = "#babbf1"
text = "#c6d0f5"
subtext1 = "#b5bfe2"
subtext0 = "#a5adce"
overlay2 = "#949cbb"
overlay1 = "#838ba7"
overlay0 = "#737994"
surface2 = "#626880"
surface1 = "#51576d"
surface0 = "#414559"
base = "#303446"
mantle = "#292c3c"
crust = "#232634"
