[tools]
atuin = "latest"
bat = "latest"
carapace = "latest"
eza = "latest"
fd = "latest"
gh = "latest"
"github:RivoLink/leaf" = "latest"
hunk = "latest"
jj = "latest"
jjui = "latest"
neovim = "latest"
node = "latest"
opencode = { version = "latest", allow_builds = ["@opencode/cli"] }
ripgrep = "latest"
starship = "latest"
