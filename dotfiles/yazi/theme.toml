# Catppuccin Frappé for Yazi.
#
# The flavor itself is vendored under flavors/catppuccin-frappe.yazi/ (from
# https://github.com/yazi-rs/flavors), including its matching tmtheme.xml,
# which Yazi picks up automatically for preview syntax highlighting.
#
# Both keys are set so the flavor also applies in light-mode terminals.
[flavor]
dark = "catppuccin-frappe"
light = "catppuccin-frappe"
